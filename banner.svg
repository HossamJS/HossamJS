<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hossam Rashwan, Tech Lead. Full-stack engineering and practical AI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="1040" cy="40" r="300" fill="url(#glowB)"/>
    <circle cx="820" cy="330" r="260" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="96" font-size="18" font-weight="600" letter-spacing="4" fill="#67e8f9">TECH LEAD  ·  CAIRO, EGYPT</text>
      <text x="70" y="168" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Hossam Rashwan</text>
      <rect x="72" y="192" width="96" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="72" y="246" font-size="26" font-weight="400" fill="#cbd5e1">Full-stack engineering and practical AI</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#e2e8f0" fill-opacity="0.85">
      <g transform="translate(830 112)">
        <rect width="298" height="124" rx="14" fill="#0b1020" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.14"/>
        <circle cx="22" cy="22" r="5" fill="#f87171"/>
        <circle cx="40" cy="22" r="5" fill="#fbbf24"/>
        <circle cx="58" cy="22" r="5" fill="#34d399"/>
        <text x="22" y="62"><tspan fill="#a78bfa">const</tspan> focus = [</text>
        <text x="44" y="86"><tspan fill="#67e8f9">"web"</tspan>, <tspan fill="#67e8f9">"ai"</tspan>, <tspan fill="#67e8f9">"teams"</tspan></text>
        <text x="22" y="110">];</text>
      </g>
    </g>
  </g>
</svg>
